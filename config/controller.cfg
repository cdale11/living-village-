# SDL's recognized controller mapping is used first. No keyboard events required.
# Use --diagnose-input to log GUID, mapping mode and raw button numbers.
# Set raw_mode=1 for a device with an incorrect SDL mapping.
raw_mode=0
hat=0
axis_x=0
axis_y=1

# RAW joystick button indices. These defaults are examples, not RG34XX validation.
confirm=0
back=1
inspect=2
overview=3
previous=4
next=5
zoom_out=6
zoom_in=7
menu=9
speed=8

# Fn+Start saves and exits. -1 uses SDL Guide+Start and the KNULLI RG34XX
# device profile (raw Fn=11, Start=10). Override for a custom mapping.
hotkey=-1
hotkey_start=-1

# Recognized SDL controller buttons: A=0 B=1 X=2 Y=3 Back=4 Start=6
# LeftShoulder=9 RightShoulder=10. SDL trigger axes handle zoom.
mapped_confirm=0
mapped_back=1
mapped_inspect=2
mapped_overview=3
mapped_previous=9
mapped_next=10
mapped_menu=6
mapped_speed=4
mapped_hotkey=5
